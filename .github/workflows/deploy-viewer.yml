name: Deploy viewer to GitHub Pages

# Publishes viewer/ (only the viewer — no other repo docs) via GitHub's
# Actions-based Pages deploy. Requires a one-time repo setting: Settings ->
# Pages -> Build and deployment -> Source: "GitHub Actions" (the default
# "Deploy from a branch" source can only publish / or /docs, not a custom
# folder). Once that's set, this workflow is the entire deploy pipeline —
# no manual steps after a merge to main.
#
# The viewer itself is static and reads live data (asset-index.json, the
# worklist docs, art-needs.json) via absolute raw.githubusercontent.com
# URLs, so a deploy here is just "publish this one HTML file" — nothing to
# build.

on:
  push:
    branches: [main]
    paths: ["viewer/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deployment
        uses: actions/deploy-pages@v4
